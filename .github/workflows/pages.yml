name: Pages

on:
  push:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Write the latest official release
        run: |
          curl -fsSL -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/mo7AmMeD64/cloudSTREAM3/releases/latest \
            -o src/data/release.json || echo '{}' > src/data/release.json
      - run: node build.mjs
      - run: npx playwright install --with-deps chromium
      - run: node tests/check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-screenshots
          path: tests/screenshots
          if-no-files-found: ignore

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Write the latest official release
        run: |
          curl -fsSL -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/mo7AmMeD64/cloudSTREAM3/releases/latest \
            -o src/data/release.json || echo '{}' > src/data/release.json
      - run: node build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
